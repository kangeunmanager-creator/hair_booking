<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KANG EUN — 스케줄 조회 (헤어변형)</title>
<link rel="stylesheet" as="style" crossorigin
  href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{
    --ink: #171715;
    --paper: #e7e7e5;
    --paper-2: #fafaf9;
    --line: #d1d1ce;
    --muted: #797975;
    --accent: #5c5c58;
    --ok: #3f6b4a;      --ok-bg: #eef1e8;
    --check: #93691f;   --check-bg: #f7efdc;
    --no: #93382c;      --no-bg: #f5e6e2;
    --olive: #a6b587;   --olive-dark: #7c8f5c;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ background:var(--paper); }
  body{
    font-family:'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding-bottom:64px;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- HERO ---------- */
  .hero{
    background:#dcdbd7;
    color:var(--ink);
    padding:56px 24px 84px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .hero-eyebrow{
    font-size:11px;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:#adada9;
    margin-bottom:18px;
  }
  .hero-logo{
    max-width:min(320px, 78%);
    width:100%;
    height:auto;
    display:inline-block;
  }
  .hero-sub{
    font-size:19px;
    font-weight:800;
    letter-spacing:-0.005em;
    color:var(--ink);
    margin-top:22px;
  }

  /* ---------- CARD ---------- */
  .card{
    max-width:640px;
    margin:-48px auto 0;
    background:var(--paper-2);
    border:1px solid var(--line);
    box-shadow:0 30px 60px rgba(20,19,16,0.12);
    padding:40px 30px 34px;
    position:relative;
  }

  /* ---------- STEP INDICATOR ---------- */
  .steps-wrap{ margin-bottom:34px; }
  .steps-row{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-bottom:10px;
  }
  .steps-count{
    font-size:11px;
    letter-spacing:.18em;
    color:var(--muted);
    text-transform:uppercase;
  }
  .steps-label{
    font-size:11px;
    letter-spacing:.18em;
    color:var(--ink);
    text-transform:uppercase;
    font-weight:700;
  }
  .progress-track{
    display:flex;
    gap:6px;
  }
  .progress-seg{
    height:2px;
    flex:1;
    background:var(--line);
  }
  .progress-seg.active{ background:var(--ink); }

  /* ---------- HEADINGS ---------- */
  h2{
    font-size:22px;
    font-weight:800;
    letter-spacing:-0.01em;
    margin-bottom:6px;
  }
  .hint{ font-size:12px; color:var(--muted); margin-bottom:22px; letter-spacing:.01em; }

  /* ---------- FORM ELEMENTS ---------- */
  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  label{
    display:block;
    font-size:11px;
    font-weight:700;
    letter-spacing:.12em;
    text-transform:uppercase;
    color:var(--muted);
    margin-bottom:9px;
  }
  input, select{
    width:100%;
    padding:11px 2px;
    border:none;
    border-bottom:1px solid var(--line);
    border-radius:0;
    background:transparent;
    font-family:inherit;
    font-size:15px;
    color:var(--ink);
    outline:none;
    transition:border-color .15s;
  }
  select{ padding:11px 0; appearance:none; -webkit-appearance:none; background-image:none; }
  input::placeholder{ color:#b7b1a4; }
  input:focus, select:focus{ border-bottom:1px solid var(--ink); }

  .opt-btn-group{ display:grid; gap:12px; margin-bottom:22px; }
  .opt-btn-group.two{ grid-template-columns:1fr 1fr; }
  .opt-btn{
    padding:16px 14px;
    border:1px solid var(--line);
    border-radius:0;
    background:var(--paper-2);
    color:var(--ink);
    font-weight:700;
    font-size:14px;
    letter-spacing:.04em;
    cursor:pointer;
    transition:all .15s;
  }
  .opt-btn:hover{ border-color:var(--olive-dark); }
  .opt-btn.selected{ background:var(--olive); border-color:var(--olive); color:var(--ink); }

  .time-select{ display:flex; align-items:center; gap:10px; }
  .time-select select{ flex:1; }
  .time-select span{ color:var(--muted); }

  /* ---------- BUTTONS ---------- */
  .btn-row{ display:flex; gap:12px; margin-top:30px; }
  .btn{
    flex:1;
    padding:15px;
    border-radius:0;
    font-weight:700;
    font-size:12px;
    letter-spacing:.16em;
    text-transform:uppercase;
    border:1px solid var(--ink);
    cursor:pointer;
    transition:all .15s;
  }
  .btn-primary{ background:var(--olive); color:var(--ink); border-color:var(--olive); }
  .btn-primary:hover{ background:transparent; color:var(--olive-dark); border-color:var(--olive-dark); }
  .btn-primary:disabled{ background:var(--line); border-color:var(--line); color:#fff; cursor:not-allowed; }
  .btn-outline{ background:transparent; border:1px solid var(--line); color:var(--muted); }
  .btn-outline:hover{ border-color:var(--ink); color:var(--ink); }

  /* ---------- SUMMARY ---------- */
  .summary-box{
    border:1px solid var(--line);
    padding:22px 20px;
    margin-bottom:22px;
    font-size:13.5px;
    line-height:2;
    color:var(--ink);
  }
  .summary-box strong{
    font-size:11px;
    letter-spacing:.1em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:700;
    margin-right:4px;
  }

  /* ---------- RESULTS ---------- */
  .result-card{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-left:3px solid var(--line);
    padding:16px 18px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .result-card.ok{ border-left-color:var(--ok); }
  .result-card.check{ border-left-color:var(--check); }
  .result-card.no{ border-left-color:var(--no); }
  .result-left{ display:flex; align-items:center; gap:14px; }
  .status-icon{
    width:34px; height:34px;
    border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:800; font-size:15px;
    flex-shrink:0;
  }
  .status-icon.ok{ background:var(--ok); }
  .status-icon.check{ background:var(--check); }
  .status-icon.no{ background:var(--no); }
  .staff-name{ font-weight:700; font-size:14.5px; letter-spacing:.01em; }
  .staff-status{ font-size:11.5px; color:var(--muted); margin-top:2px; }

  .error-box{
    background:var(--no-bg);
    border:1px solid var(--no);
    color:var(--no);
    padding:14px 16px;
    font-size:13.5px;
    margin-bottom:18px;
  }
  .fee-box{
    background:var(--paper);
    border:1px solid var(--line);
    padding:14px 16px;
    font-size:13.5px;
    color:var(--ink);
    margin-top:14px;
  }
  .fee-box strong{ color:var(--accent); }
  .loading{
    text-align:center;
    padding:26px;
    font-size:11px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--muted);
  }

  .result-block-title{
    font-size:11px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--muted);
    font-weight:700;
    margin-bottom:14px;
  }
  .result-block{
    background:var(--paper);
    border:1px solid var(--line);
    padding:22px 20px;
  }
  .note-line{
    text-align:center;
    font-size:12.5px;
    color:var(--muted);
    margin-top:20px;
    letter-spacing:.02em;
  }

  @media (max-width:480px){
    .grid2{ grid-template-columns:1fr; gap:18px; }
    .opt-btn-group.two{ grid-template-columns:1fr; }
    .card{ padding:30px 20px 28px; }
  }

  :focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  /* ---------- COPY MODAL ---------- */
  .copy-modal-overlay{
    position:fixed;
    inset:0;
    background:rgba(23,23,21,0.72);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    z-index:9999;
  }
  .copy-modal{
    background:var(--paper-2);
    border:1px solid var(--line);
    max-width:420px;
    width:100%;
    padding:32px 26px 26px;
    text-align:center;
    box-shadow:0 30px 60px rgba(0,0,0,0.35);
  }
  .copy-modal-icon{
    width:56px; height:56px;
    border-radius:50%;
    background:var(--ok);
    color:#fff;
    display:flex; align-items:center; justify-content:center;
    font-size:26px; font-weight:800;
    margin:0 auto 18px;
  }
  .copy-modal-icon.fail{ background:var(--no); }
  .copy-modal-title{
    font-size:18px;
    font-weight:800;
    margin-bottom:10px;
  }
  .copy-modal-desc{
    font-size:13.5px;
    color:var(--muted);
    line-height:1.6;
    margin-bottom:20px;
  }
  .copy-modal-textarea{
    width:100%;
    min-height:140px;
    max-height:240px;
    overflow-y:auto;
    padding:12px;
    border:1px solid var(--line);
    background:var(--paper);
    font-size:12.5px;
    line-height:1.6;
    white-space:pre-wrap;
    text-align:left;
    color:var(--ink);
    margin-bottom:18px;
    font-family:inherit;
  }
  .copy-modal-btn-row{ display:flex; gap:10px; }
  .copy-modal-btn{
    flex:1;
    padding:13px;
    font-weight:700;
    font-size:12px;
    letter-spacing:.1em;
    text-transform:uppercase;
    border:1px solid var(--ink);
    cursor:pointer;
  }
  .copy-modal-btn.primary{ background:var(--olive); border-color:var(--olive); color:var(--ink); }
  .copy-modal-btn.outline{ background:transparent; border:1px solid var(--line); color:var(--muted); }
</style>
</head>

  <div class="hero-sub">스케줄 조회 (헤어변형)</div>
</div>

<div class="card">
  <div class="steps-wrap" id="stepsIndicator"></div>
  <div id="content"></div>
</div>

<div id="copyModalRoot"></div>

<script>
// ⚠️ Apps Script 웹 앱 배포 URL
const API_URL = 'https://script.google.com/macros/s/AKfycbxAac9U1Z5E6MZ1OFghfLe-IJ74l3_ao2LrwbdvUC_aZs2mv9otTYasS_R0CsTJ5v7R/exec';

const STAFF_DISPLAY = { '강은':'강은 대표원장','재열':'재열 부원장','민영':'민영 실장','희지':'희지 실장' };
const HOURS = Array.from({length:13}, (_,i)=>String(i+9).padStart(2,'0'));
const MINUTES = ['00','30'];
const SERVICE_TO_API = { '촬영':'촬영', '본식2부':'2부' };
const STEP_LABELS = ['문의 유형','서비스 · 시간','날짜 · 장소 · 연락처','확인 및 예약'];

// ⭐ 플래너 정보 저장(같은 브라우저에서 재입력 방지) — GitHub Pages 실배포 환경에서는 localStorage 사용 가능
const PLANNER_STORAGE_KEY = 'khe_planner_info_v1';
function loadSavedPlannerInfo(){
  try{
    const raw = localStorage.getItem(PLANNER_STORAGE_KEY);
    if(!raw) return { plannerCompany:'', plannerName:'', plannerPhone:'' };
    const saved = JSON.parse(raw);
    return {
      plannerCompany: saved.plannerCompany || '',
      plannerName: saved.plannerName || '',
      plannerPhone: saved.plannerPhone || ''
    };
  }catch(e){
    return { plannerCompany:'', plannerName:'', plannerPhone:'' };
  }
}
function savePlannerInfo(f){
  try{
    localStorage.setItem(PLANNER_STORAGE_KEY, JSON.stringify({
      plannerCompany: f.plannerCompany || '',
      plannerName: f.plannerName || '',
      plannerPhone: f.plannerPhone || ''
    }));
  }catch(e){ /* 저장 실패 시 무시 */ }
}

const savedPlanner = loadSavedPlannerInfo();

let state = {
  step: 1,
  inquiryType: '',
  serviceType: '',
  form: { name:'', phone:'', plannerCompany:savedPlanner.plannerCompany, plannerName:savedPlanner.plannerName, plannerPhone:savedPlanner.plannerPhone, date:'', startTime:'', durationHour:'', ceremonyTime:'', place:'' },
  result: null,
  error: '',
  loading: false,
  copyModal: null // { success: bool, text: string } | null
};

// ⭐ 수정됨: 텍스트/날짜 입력은 화면을 다시 그리지 않고 값만 조용히 저장 (입력 중 포커스 풀림 방지)
function updateForm(key, val){ state.form[key] = val; }
// ⭐ 드롭다운(select) 변경 시에는 재렌더링해도 문제없으므로 별도 함수 사용
function updateFormAndRender(key, val){ state.form[key] = val; render(); }

function resetAll(){
  const saved = loadSavedPlannerInfo();
  state = { step:1, inquiryType:'', serviceType:'', form:{ name:'', phone:'', plannerCompany:saved.plannerCompany, plannerName:saved.plannerName, plannerPhone:saved.plannerPhone, date:'', startTime:'', durationHour:'', ceremonyTime:'', place:'' }, result:null, error:'', loading:false, copyModal:null };
  render();
}

function timeSelectHtml(id, value){
  const [h,m] = value ? value.split(':') : ['',''];
  return `
    <div class="time-select">
      <select onchange="onTimeHour('${id}', this.value)">
        <option value="">시</option>
        ${HOURS.map(hh=>`<option value="${hh}" ${h===hh?'selected':''}>${hh}시</option>`).join('')}
      </select>
      <span>:</span>
      <select onchange="onTimeMin('${id}', this.value)">
        <option value="">분</option>
        ${MINUTES.map(mm=>`<option value="${mm}" ${m===mm?'selected':''}>${mm}분</option>`).join('')}
      </select>
    </div>`;
}
function onTimeHour(id, h){
  const cur = state.form[id] || '';
  const m = cur.split(':')[1] || '00';
  updateFormAndRender(id, `${h}:${m}`);
}
function onTimeMin(id, m){
  const cur = state.form[id] || '';
  const h = cur.split(':')[0] || '09';
  updateFormAndRender(id, `${h}:${m}`);
}

function setInquiryType(t){ state.inquiryType = t; render(); }
function setServiceType(t){ state.serviceType = t; render(); }
function goStep(n){ state.step = n; render(); }

function canSubmit(){
  const f = state.form;
  if(!state.inquiryType || !state.serviceType || !f.date || !f.place) return false;
  if(state.inquiryType === '신랑/신부' && (!f.name || !f.phone)) return false;
  if(state.inquiryType === '플래너' && (!f.plannerCompany || !f.plannerName || !f.plannerPhone)) return false;
  if(state.serviceType === '촬영' && (!f.startTime || !f.durationHour)) return false;
  if(state.serviceType === '본식2부' && !f.ceremonyTime) return false;
  return true;
}

async function handleCheck(){
  if(!canSubmit()){ state.error = '필수 항목을 모두 입력해주세요.'; render(); return; }
  state.error = ''; state.loading = true; state.result = null; render();

  try {
    const apiServiceType = SERVICE_TO_API[state.serviceType];
    const params = new URLSearchParams({
      action: 'checkAvailability',
      inquiryType: state.inquiryType,
      name: state.form.name,
      phone: state.form.phone,
      serviceType: apiServiceType,
      date: state.form.date,
      place: state.form.place
    });
    if(state.serviceType === '촬영'){
      params.set('startTime', state.form.startTime);
      params.set('durationMin', String(Number(state.form.durationHour)*60));
    } else {
      params.set('ceremonyTime', state.form.ceremonyTime);
    }

    const res = await fetch(`${API_URL}?${params.toString()}`);
    const data = await res.json();

    if(!data.success){
      state.error = data.error || '조회 중 오류가 발생했습니다.';
    } else {
      state.result = data;
    }
  } catch(err){
    state.error = '서버 연결에 실패했습니다: ' + err.message;
  } finally {
    state.loading = false;
    render();
  }
}

const KAKAO_CHANNEL_URL = 'http://pf.kakao.com/_uLVlG/chat';

function buildInquirySummaryText(){
  const f = state.form;
  const lines = [];
  lines.push('[헤어변형 스케줄 조회 내용]');
  lines.push(`문의유형: ${state.inquiryType}`);
  lines.push(`서비스: ${state.serviceType==='본식2부'?'본식2부 헤어변형':'촬영 헤어변형'}`);
  lines.push(`날짜: ${f.date}`);
  lines.push(`시간: ${state.serviceType==='촬영' ? `${f.startTime}부터 ${f.durationHour}시간` : `예식 ${f.ceremonyTime}`}`);
  lines.push(`장소: ${f.place}`);
  if(state.inquiryType==='플래너'){
    lines.push(`업체/담당자: ${f.plannerCompany} ${f.plannerName}`);
    lines.push(`연락처: ${f.plannerPhone}`);
  } else {
    lines.push(`신부명: ${f.name}`);
    lines.push(`연락처: ${f.phone}`);
  }

  if(state.result && state.result.raw){
    const raw = state.result.raw;
    lines.push('');
    lines.push('[조회 결과]');
    if(raw.type === 'HIGH_FEE'){
      lines.push(`상담원 확인 필요: ${raw.message}`);
    } else {
      Object.entries(raw.results).forEach(([staff, r]) => {
        const desc = r.status==='O' ? '예약 가능' : (r.status==='X' ? (r.reason||'예약 불가') : `확인 필요 (대안: ${r.alternativeTime})`);
        lines.push(`- ${STAFF_DISPLAY[staff]}: ${desc}`);
      });
      lines.push(`출장비 안내: ${raw.feeMessage}`);
      if(isLateCharge()){
        lines.push('레이트차지: 종료시간이 20:30 이후로 5만원이 추가됩니다');
      }
    }
  }
  return lines.join('\n');
}

async function copyAndOpenKakao(){
  const text = buildInquirySummaryText();
  let success = true;
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    success = false;
  }
  state.copyModal = { success, text };
  render();
  window.open(KAKAO_CHANNEL_URL, '_blank');
}

async function retryCopyModal(){
  if(!state.copyModal) return;
  try{
    await navigator.clipboard.writeText(state.copyModal.text);
    state.copyModal.success = true;
  }catch(e){
    state.copyModal.success = false;
  }
  render();
}

function closeCopyModal(){
  state.copyModal = null;
  render();
}

function renderCopyModal(){
  const root = document.getElementById('copyModalRoot');
  if(!state.copyModal){
    root.innerHTML = '';
    return;
  }
  const m = state.copyModal;
  if(m.success){
    root.innerHTML = `
      <div class="copy-modal-overlay" onclick="if(event.target===this) closeCopyModal()">
        <div class="copy-modal">
          <div class="copy-modal-icon">✓</div>
          <div class="copy-modal-title">복사 완료!</div>
          <div class="copy-modal-desc">방금 뜬 카카오채널 채팅창을 열고,<br>입력창을 <strong>길게 눌러 "붙여넣기"</strong>를 눌러주세요.</div>
          <div class="copy-modal-btn-row">
            <button class="copy-modal-btn primary" onclick="closeCopyModal()">확인했어요</button>
          </div>
        </div>
      </div>`;
  } else {
    root.innerHTML = `
      <div class="copy-modal-overlay" onclick="if(event.target===this) closeCopyModal()">
        <div class="copy-modal">
          <div class="copy-modal-icon fail">!</div>
          <div class="copy-modal-title">자동 복사에 실패했어요</div>
          <div class="copy-modal-desc">아래 내용을 직접 길게 눌러 선택 후 복사해서,<br>카카오채널 채팅창에 붙여넣어 주세요.</div>
          <div class="copy-modal-textarea">${m.text}</div>
          <div class="copy-modal-btn-row">
            <button class="copy-modal-btn outline" onclick="retryCopyModal()">다시 복사 시도</button>
            <button class="copy-modal-btn primary" onclick="closeCopyModal()">닫기</button>
          </div>
        </div>
      </div>`;
  }
}

function render(){
  renderCopyModal();
  document.getElementById('stepsIndicator').innerHTML = `
    <div class="steps-row">
      <span class="steps-count">Step ${state.step} / 4</span>
      <span class="steps-label">${STEP_LABELS[state.step-1]}</span>
    </div>
    <div class="progress-track">
      ${[1,2,3,4].map(s=>`<div class="progress-seg ${state.step>=s?'active':''}"></div>`).join('')}
    </div>
  `;

  const c = document.getElementById('content');
  const f = state.form;

  if(state.step === 1){
    c.innerHTML = `
      <h2>문의 유형을 선택해주세요</h2>
      <p class="hint">신랑·신부 본인이신가요, 웨딩 플래너이신가요</p>
      <div class="opt-btn-group two">
        <button class="opt-btn ${state.inquiryType==='신랑/신부'?'selected':''}" onclick="setInquiryType('신랑/신부')">신랑/신부</button>
        <button class="opt-btn ${state.inquiryType==='플래너'?'selected':''}" onclick="setInquiryType('플래너')">플래너</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" ${!state.inquiryType?'disabled':''} onclick="goStep(2)">다음</button>
      </div>`;
    return;
  }

  if(state.step === 2){
    let timeBlock = '';
    if(state.serviceType === '촬영'){
      timeBlock = `
        <div class="grid2">
          <div><label>시작 시간</label>${timeSelectHtml('startTime', f.startTime)}</div>
          <div><label>진행 시간</label>
            <select onchange="updateFormAndRender('durationHour', this.value)">
              <option value="">선택</option>
              ${[1,2,3,4,5,6,7,8].map(h=>`<option value="${h}" ${f.durationHour==h?'selected':''}>${h}시간</option>`).join('')}
            </select>
          </div>
        </div>`;
    } else if(state.serviceType === '본식2부'){
      timeBlock = `
        <div>
          <label>예식 시작 시간</label>
          ${timeSelectHtml('ceremonyTime', f.ceremonyTime)}
          <p class="hint" style="margin-top:10px;margin-bottom:0;">* 2부 헤어변형 작업시간은 예식시간+30분부터 1시간으로 자동 계산됩니다</p>
        </div>`;
    }

    c.innerHTML = `
      <h2>서비스 종류 및 시간</h2>
      <p class="hint">예약 가능 시간 · 오전 9시 ~ 오후 9시 (30분 단위)</p>
      <div class="opt-btn-group two">
        <button class="opt-btn ${state.serviceType==='촬영'?'selected':''}" onclick="setServiceType('촬영')">촬영</button>
        <button class="opt-btn ${state.serviceType==='본식2부'?'selected':''}" onclick="setServiceType('본식2부')">본식2부</button>
      </div>
      ${timeBlock}
      <div class="btn-row">
        <button class="btn btn-outline" onclick="goStep(1)">이전</button>
        <button class="btn btn-primary" onclick="tryStep3()">다음</button>
      </div>`;
    return;
  }

  if(state.step === 3){
    const nameBlock = state.inquiryType === '신랑/신부' ? `
      <div class="grid2">
        <div><label>신부 이름</label><input type="text" value="${f.name}" oninput="updateForm('name', this.value)" placeholder="홍길동"></div>
        <div><label>연락처</label><input type="tel" value="${f.phone}" oninput="updateForm('phone', this.value)" placeholder="010-0000-0000"></div>
      </div>` : `
      <div class="grid2">
        <div><label>업체명</label><input type="text" value="${f.plannerCompany}" oninput="updateForm('plannerCompany', this.value)" placeholder="예: 이유플랜"></div>
        <div><label>담당자명</label><input type="text" value="${f.plannerName}" oninput="updateForm('plannerName', this.value)" placeholder="담당 플래너 이름"></div>
      </div>
      <div style="margin-top:20px;">
        <label>연락처</label>
        <input type="tel" value="${f.plannerPhone}" oninput="updateForm('plannerPhone', this.value)" placeholder="010-0000-0000">
      </div>`;

    c.innerHTML = `
      <h2>날짜 · 장소 · 연락처</h2>
      <p class="hint">예약을 확인할 정보를 입력해주세요</p>
      <div style="margin-bottom:20px;">
        <label>희망 날짜</label>
        <input type="date" value="${f.date}" min="${new Date().toISOString().split('T')[0]}" oninput="updateForm('date', this.value)">
      </div>
      <div style="margin-bottom:20px;">
        <label>스튜디오 / 예식장명</label>
        <input type="text" value="${f.place}" oninput="updateForm('place', this.value)" placeholder="예: 아이브, 신라호텔">
      </div>
      ${nameBlock}
      <div class="btn-row">
        <button class="btn btn-outline" onclick="goStep(2)">이전</button>
        <button class="btn btn-primary" onclick="tryStep4()">다음</button>
      </div>`;
    return;
  }

  if(state.step === 4){
    let resultHtml = '';
    if(state.result && state.result.raw){
      const raw = state.result.raw;
      if(raw.type === 'HIGH_FEE'){
        resultHtml = `<div class="error-box" style="background:var(--check-bg);border-color:var(--check);color:var(--check);">상담원 확인 필요<br>${raw.message}</div>`;
      } else {
        const cards = Object.entries(raw.results).map(([staff, r]) => {
          const cls = r.status==='O'?'ok':(r.status==='CHECK'?'check':'no');
          const icon = r.status==='O'?'✓':(r.status==='CHECK'?'!':'✕');
          const desc = r.status==='O' ? '예약 가능' : (r.status==='X' ? (r.reason||'예약 불가') : `확인 필요 (대안: ${r.alternativeTime})`);
          return `
            <div class="result-card ${cls}">
              <div class="result-left">
                <div class="status-icon ${cls}">${icon}</div>
                <div><div class="staff-name">${STAFF_DISPLAY[staff]}</div><div class="staff-status">${desc}</div></div>
              </div>
            </div>`;
        }).join('');
        const lateChargeHtml = isLateCharge() ? `
          <div class="fee-box" style="border-color:var(--check);background:var(--check-bg);color:var(--check);">
            레이트차지 안내 · <strong>종료시간이 20:30 이후로 5만원이 추가됩니다</strong>
          </div>` : '';
        resultHtml = `
          <div class="result-block">
            <div class="result-block-title">담당자별 예약 가능 여부</div>
            ${cards}
          </div>
          <div class="fee-box">출장비 안내 · <strong>${raw.feeMessage}</strong></div>
          ${lateChargeHtml}`;
      }
      resultHtml += `
        <p class="note-line">아래 버튼으로 조회 내용과 결과를 복사해 카카오채널로 바로 상담하실 수 있습니다.</p>
        <div class="btn-row">
          <button class="btn btn-outline" onclick="resetAll()">다른 스케줄 조회</button>
          <button class="btn btn-primary" onclick="copyAndOpenKakao()">해당 스케줄 예약·상담하기</button>
        </div>`;
    }

    c.innerHTML = `
      <h2>문의 내용 확인</h2>
      <p class="hint">아래 내용이 맞는지 확인해주세요</p>
      <div class="summary-box">
        <div><strong>문의유형</strong> ${state.inquiryType}</div>
        <div><strong>서비스</strong> ${state.serviceType==='본식2부'?'본식2부 헤어변형':'촬영 헤어변형'}</div>
        <div><strong>날짜</strong> ${f.date}</div>
        <div><strong>시간</strong> ${state.serviceType==='촬영' ? `${f.startTime}부터 ${f.durationHour}시간` : `예식 ${f.ceremonyTime}`}</div>
        <div><strong>장소</strong> ${f.place}</div>
        <div><strong>${state.inquiryType==='플래너'?'업체/담당자':'신부명'}</strong> ${state.inquiryType==='플래너'?`${f.plannerCompany} ${f.plannerName}`:f.name}</div>
        <div><strong>연락처</strong> ${state.inquiryType==='플래너'?f.plannerPhone:f.phone}</div>
      </div>
      ${state.error ? `<div class="error-box">${state.error}</div>` : ''}
      ${!state.result && !state.loading ? `<div class="btn-row"><button class="btn btn-primary" onclick="handleCheck()">예약 가능 여부 확인하기</button></div>` : ''}
      ${state.loading ? `<div class="loading">확인 중</div>` : ''}
      ${resultHtml}
      ${!state.result ? `<div class="btn-row"><button class="btn btn-outline" onclick="goStep(3)">이전으로</button></div>` : ''}
    `;
    return;
  }
}

// ⭐ 레이트차지(종료시간 20:30 이후 +5만원) 해당 여부 계산 — 프론트에서 직접 판단, 고가출장(HIGH_FEE) 케이스는 제외
function toMinutes(hhmm){
  if(!hhmm) return null;
  const [h,m] = hhmm.split(':').map(Number);
  if(Number.isNaN(h) || Number.isNaN(m)) return null;
  return h*60 + m;
}
function computeEndMinutes(){
  const f = state.form;
  if(state.serviceType === '촬영'){
    const start = toMinutes(f.startTime);
    if(start === null || !f.durationHour) return null;
    return start + Number(f.durationHour)*60;
  }
  if(state.serviceType === '본식2부'){
    const ceremony = toMinutes(f.ceremonyTime);
    if(ceremony === null) return null;
    return ceremony + 30 + 60; // 예식시간+30분부터 1시간
  }
  return null;
}
function isLateCharge(){
  const end = computeEndMinutes();
  if(end === null) return false;
  return end >= (20*60 + 30); // 20:30 정각 포함, 그 이후 종료면 해당
}

function tryStep3(){
  if(!state.serviceType) return;
  if(state.serviceType==='촬영' && (!state.form.startTime || !state.form.durationHour)) return;
  if(state.serviceType==='본식2부' && !state.form.ceremonyTime) return;
  goStep(3);
}
function tryStep4(){
  const f = state.form;
  if(state.inquiryType==='플래너'){
    f.name = `${f.plannerCompany} ${f.plannerName}`;
    f.phone = f.plannerPhone;
    savePlannerInfo(f); // 같은 브라우저 재방문 시 자동으로 채워지도록 저장
  }
  if(f.date && f.place &&
    ((state.inquiryType==='신랑/신부' && f.name && f.phone) ||
     (state.inquiryType==='플래너' && f.plannerCompany && f.plannerName && f.plannerPhone))){
    goStep(4);
  }
}

render();
</script>
