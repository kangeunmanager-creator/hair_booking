<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>KANG EUN | 헤어변형 출장 예약문의</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Helvetica Neue', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', sans-serif;
    background: #faf9f7;
    color: #1a1a1a;
  }

  /* ===== 상단 네비게이션 ===== */
  .nav {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 40px;
    background: #0a0a0a;
  }
  .nav .logo {
    font-size: 22px; letter-spacing: 6px; font-weight: 300; color: #fff;
  }
  .nav .menu { display: flex; gap: 28px; }
  .nav .menu span { color: rgba(255,255,255,0.75); font-size: 13px; letter-spacing: 1px; }

  /* ===== 히어로 배너 ===== */
  .hero {
    position: relative;
    background: radial-gradient(ellipse at 30% 20%, #3a3a3a 0%, #0a0a0a 60%);
    padding: 90px 40px 110px;
    text-align: center;
    color: #fff;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(120deg, rgba(255,255,255,0.02) 0px, rgba(255,255,255,0.02) 2px, transparent 2px, transparent 40px);
    pointer-events: none;
  }
  .hero .quote {
    font-size: 34px; font-weight: 200; letter-spacing: 3px; margin-bottom: 18px;
  }
  .hero .sub {
    font-size: 13px; letter-spacing: 3px; color: rgba(255,255,255,0.6); text-transform: uppercase;
    line-height: 2;
  }

  /* ===== 카드 영역 ===== */
  .wrap { max-width: 640px; margin: -60px auto 60px; padding: 0 20px; position: relative; z-index: 2; }
  .card {
    background: #fff;
    padding: 44px 32px;
    box-shadow: 0 30px 60px rgba(0,0,0,0.12);
  }

  .steps { display: flex; justify-content: center; margin-bottom: 40px; }
  .step-dot {
    width: 30px; height: 30px; border-radius: 50%; display:flex; align-items:center; justify-content:center;
    font-weight:400; font-size:13px; background:#f0efec; color:#999; border: 1px solid #e5e3df;
  }
  .step-dot.active { background: #0a0a0a; color: #fff; border-color: #0a0a0a; }
  .step-line { width: 32px; height: 1px; background: #e5e3df; }
  .step-line.active { background: #0a0a0a; }

  h2 {
    font-size: 20px; font-weight: 300; margin-bottom: 6px; letter-spacing: 1px;
  }
  .hint { font-size: 12px; color: #999; margin-bottom: 24px; letter-spacing: 0.3px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  label {
    display:block; font-size: 11px; font-weight: 600; margin-bottom: 8px;
    letter-spacing: 1.5px; text-transform: uppercase; color: #666;
  }
  input, select {
    width: 100%; padding: 13px 12px; border: 1px solid #ddd; border-radius: 0;
    font-size: 14px; outline: none; background: #fff; color: #1a1a1a;
  }
  input:focus, select:focus { border-color: #0a0a0a; }

  .opt-btn-group { display: grid; gap: 10px; margin-bottom: 20px; }
  .opt-btn-group.two { grid-template-columns: 1fr 1fr; }
  .opt-btn {
    padding: 16px; border-radius: 0; border: 1px solid #ddd;
    font-weight: 500; font-size: 14px; letter-spacing: 1px; cursor: pointer; background: #fff; color:#333;
    transition: 0.15s;
  }
  .opt-btn.selected { border-color: #0a0a0a; background: #0a0a0a; color: #fff; }
  .opt-btn:hover { border-color: #0a0a0a; }

  .time-select { display: flex; align-items: center; gap: 8px; }
  .time-select select { flex: 1; }

  .btn-row { display: flex; gap: 10px; margin-top: 28px; }
  .btn {
    flex: 1; padding: 16px; border-radius: 0; font-weight: 500; font-size: 13px;
    letter-spacing: 2px; text-transform: uppercase;
    border: 1px solid #0a0a0a; cursor: pointer; transition: 0.15s;
  }
  .btn-primary { background: #0a0a0a; color: #fff; }
  .btn-primary:hover { background: #2b2b2b; }
  .btn-primary:disabled { background: #ccc; border-color: #ccc; cursor: not-allowed; }
  .btn-outline { background: #fff; border: 1px solid #ccc; color: #444; }
  .btn-outline:hover { border-color: #0a0a0a; color: #0a0a0a; }

  .summary-box {
    background: #faf9f7; border: 1px solid #eee; padding: 22px; margin-bottom: 22px; font-size: 13px; line-height: 2.1;
  }
  .summary-box strong { color: #0a0a0a; font-weight: 600; }

  .result-card {
    border-radius: 0; padding: 16px 18px; border: 1px solid #e5e3df;
    display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;
  }
  .result-card.ok { border-color: #0a0a0a; background: #fafafa; }
  .result-card.check { border-color: #b8860b; background: #fdfaf3; }
  .result-card.no { border-color: #ddd; background: #f8f8f8; }
  .result-left { display:flex; align-items:center; gap:14px; }
  .status-icon {
    width: 34px; height: 34px; border-radius: 50%; display:flex; align-items:center; justify-content:center;
    color:white; font-weight:600; font-size:15px;
  }
  .status-icon.ok { background: #0a0a0a; }
  .status-icon.check { background: #b8860b; }
  .status-icon.no { background: #bbb; }
  .staff-name { font-weight: 600; font-size: 14px; letter-spacing: 0.5px; }
  .staff-status { font-size: 11px; color: #888; letter-spacing: 0.3px; margin-top: 2px; }

  .error-box {
    background: #faf5f5; border: 1px solid #e0c0c0; color: #8b3a3a;
    border-radius: 0; padding: 14px 16px; font-size: 13px; margin-bottom: 16px;
  }
  .fee-box {
    background: #faf9f7; border: 1px solid #eee; padding: 14px 16px; font-size: 13px; color: #444; margin-top: 12px;
  }
  .loading { text-align: center; padding: 30px; color: #999; font-size: 13px; letter-spacing: 2px; }

  .footer {
    text-align: center; padding: 40px 20px 60px; font-size: 11px; letter-spacing: 2px; color: #aaa;
    text-transform: uppercase;
  }
</style>
</head>
<body>

<div class="nav">
  <div class="logo">KANG EUN</div>
  <div class="menu">
    <span>Salon</span><span>Wedding</span><span>About</span><span>Contact</span>
  </div>
</div>

<div class="hero">
  <div class="quote">" FIND A NEW SELF "</div>
  <div class="sub">HAIR CHANGE ON-SITE BOOKING<br>강은 · 재열 · 민영 · 희지 실시간 예약 가능 여부 확인</div>
</div>

<div class="wrap">
  <div class="card">
    <div class="steps" id="stepsIndicator"></div>
    <div id="content"></div>
  </div>
</div>

<div class="footer">KANG EUN HAIR STUDIO</div>

<script>
// ⚠️ Apps Script 웹 앱 배포 URL
const API_URL = 'https://script.google.com/macros/s/AKfycbxAac9U1Z5E6MZ1OFghfLe-IJ74l3_ao2LrwbdvUC_aZs2mv9otTYasS_R0CsTJ5v7R/exec';

const STAFF_DISPLAY = { '강은':'강은 대표원장','재열':'재열 부원장','민영':'민영 실장','희지':'희지 실장' };
const HOURS = Array.from({length:13}, (_,i)=>String(i+9).padStart(2,'0'));
const MINUTES = ['00','30'];
const SERVICE_TO_API = { '촬영':'촬영', '본식2부':'2부' };

let state = {
  step: 1,
  inquiryType: '',
  serviceType: '',
  form: { name:'', phone:'', plannerCompany:'', plannerName:'', date:'', startTime:'', durationHour:'', ceremonyTime:'', place:'' },
  result: null,
  error: '',
  loading: false
};

// 텍스트/날짜 입력은 화면을 다시 그리지 않고 값만 조용히 저장 (입력 중 포커스 풀림 방지)
function updateForm(key, val){ state.form[key] = val; }
// 드롭다운(select) 변경 시에는 재렌더링해도 문제없으므로 별도 함수 사용
function updateFormAndRender(key, val){ state.form[key] = val; render(); }

function resetAll(){
  state = { step:1, inquiryType:'', serviceType:'', form:{ name:'', phone:'', plannerCompany:'', plannerName:'', date:'', startTime:'', durationHour:'', ceremonyTime:'', place:'' }, result:null, error:'', loading:false };
  render();
}

function timeSelectHtml(id, value){
  const [h,m] = value ? value.split(':') : ['',''];
  return `
    <div class="time-select">
      <select onchange="onTimeHour('${id}', this.value)">
        <option value="">시</option>
        ${HOURS.map(hh=>`<option value="${hh}" ${h===hh?'selected':''}>${hh}시</option>`).join('')}
      </select>
      <span>:</span>
      <select onchange="onTimeMin('${id}', this.value)">
        <option value="">분</option>
        ${MINUTES.map(mm=>`<option value="${mm}" ${m===mm?'selected':''}>${mm}분</option>`).join('')}
      </select>
    </div>`;
}
function onTimeHour(id, h){
  const cur = state.form[id] || '';
  const m = cur.split(':')[1] || '00';
  updateFormAndRender(id, `${h}:${m}`);
}
function onTimeMin(id, m){
  const cur = state.form[id] || '';
  const h = cur.split(':')[0] || '09';
  updateFormAndRender(id, `${h}:${m}`);
}

function setInquiryType(t){ state.inquiryType = t; render(); }
function setServiceType(t){ state.serviceType = t; render(); }
function goStep(n){ state.step = n; render(); }

function canSubmit(){
  const f = state.form;
  if(!state.inquiryType || !state.serviceType || !f.date || !f.place) return false;
  if(state.inquiryType === '신랑/신부' && (!f.name || !f.phone)) return false;
  if(state.inquiryType === '플래너' && (!f.plannerCompany || !f.plannerName)) return false;
  if(state.serviceType === '촬영' && (!f.startTime || !f.durationHour)) return false;
  if(state.serviceType === '본식2부' && !f.ceremonyTime) return false;
  return true;
}

async function handleCheck(){
  if(!canSubmit()){ state.error = '필수 항목을 모두 입력해주세요.'; render(); return; }
  state.error = ''; state.loading = true; state.result = null; render();

  try {
    const apiServiceType = SERVICE_TO_API[state.serviceType];
    const params = new URLSearchParams({
      action: 'checkAvailability',
      inquiryType: state.inquiryType,
      name: state.form.name,
      phone: state.form.phone,
      serviceType: apiServiceType,
      date: state.form.date,
      place: state.form.place
    });
    if(state.serviceType === '촬영'){
      params.set('startTime', state.form.startTime);
      params.set('durationMin', String(Number(state.form.durationHour)*60));
    } else {
      params.set('ceremonyTime', state.form.ceremonyTime);
    }

    const res = await fetch(`${API_URL}?${params.toString()}`);
    const data = await res.json();

    if(!data.success){
      state.error = data.error || '조회 중 오류가 발생했습니다.';
    } else {
      state.result = data;
    }
  } catch(err){
    state.error = '서버 연결에 실패했습니다: ' + err.message;
  } finally {
    state.loading = false;
    render();
  }
}

function render(){
  document.getElementById('stepsIndicator').innerHTML = [1,2,3,4].map(s => `
    <div style="display:flex;align-items:center;">
      <div class="step-dot ${state.step>=s?'active':''}">${s}</div>
      ${s<4 ? `<div class="step-line ${state.step>s?'active':''}"></div>` : ''}
    </div>
  `).join('');

  const c = document.getElementById('content');
  const f = state.form;

  if(state.step === 1){
    c.innerHTML = `
      <h2>문의 유형</h2>
      <p class="hint">신랑·신부 또는 플래너 중 선택해주세요</p>
      <div class="opt-btn-group two">
        <button class="opt-btn ${state.inquiryType==='신랑/신부'?'selected':''}" onclick="setInquiryType('신랑/신부')">신랑 · 신부</button>
        <button class="opt-btn ${state.inquiryType==='플래너'?'selected':''}" onclick="setInquiryType('플래너')">플래너</button>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" ${!state.inquiryType?'disabled':''} onclick="goStep(2)">다음</button>
      </div>`;
    return;
  }

  if(state.step === 2){
    let timeBlock = '';
    if(state.serviceType === '촬영'){
      timeBlock = `
        <div class="grid2">
          <div><label>시작 시간</label>${timeSelectHtml('startTime', f.startTime)}</div>
          <div><label>진행 시간</label>
            <select onchange="updateFormAndRender('durationHour', this.value)">
              <option value="">선택</option>
              ${[1,2,3,4,5,6,7,8].map(h=>`<option value="${h}" ${f.durationHour==h?'selected':''}>${h}시간</option>`).join('')}
            </select>
          </div>
        </div>`;
    } else if(state.serviceType === '본식2부'){
      timeBlock = `
        <div>
          <label>예식 시작 시간</label>
          ${timeSelectHtml('ceremonyTime', f.ceremonyTime)}
          <p class="hint" style="margin-top:10px;">2부 헤어변형 작업시간은 예식시간 +30분부터 1시간으로 자동 계산됩니다</p>
        </div>`;
    }

    c.innerHTML = `
      <h2>서비스 · 시간</h2>
      <p class="hint">예약 가능 시간 09:00 – 21:00 (30분 단위)</p>
      <div class="opt-btn-group two">
        <button class="opt-btn ${state.serviceType==='촬영'?'selected':''}" onclick="setServiceType('촬영')">촬영</button>
        <button class="opt-btn ${state.serviceType==='본식2부'?'selected':''}" onclick="setServiceType('본식2부')">본식2부</button>
      </div>
      ${timeBlock}
      <div class="btn-row">
        <button class="btn btn-outline" onclick="goStep(1)">이전</button>
        <button class="btn btn-primary" onclick="tryStep3()">다음</button>
      </div>`;
    return;
  }

  if(state.step === 3){
    const nameBlock = state.inquiryType === '신랑/신부' ? `
      <div class="grid2">
        <div><label>신부 이름</label><input type="text" value="${f.name}" oninput="updateForm('name', this.value)" placeholder="홍길동"></div>
        <div><label>연락처</label><input type="tel" value="${f.phone}" oninput="updateForm('phone', this.value)" placeholder="010-0000-0000"></div>
      </div>` : `
      <div class="grid2">
        <div><label>업체명</label><input type="text" value="${f.plannerCompany}" oninput="updateForm('plannerCompany', this.value)" placeholder="예: 이유플랜"></div>
        <div><label>담당자명</label><input type="text" value="${f.plannerName}" oninput="updateForm('plannerName', this.value)" placeholder="담당 플래너 이름"></div>
      </div>`;

    c.innerHTML = `
      <h2>날짜 · 장소 · 연락처</h2>
      <div style="margin-bottom:18px;">
        <label>희망 날짜</label>
        <input type="date" value="${f.date}" min="${new Date().toISOString().split('T')[0]}" oninput="updateForm('date', this.value)">
      </div>
      <div style="margin-bottom:18px;">
        <label>스튜디오 / 예식장명</label>
        <input type="text" value="${f.place}" oninput="updateForm('place', this.value)" placeholder="예: 베리굿, 신라호텔">
      </div>
      ${nameBlock}
      <div class="btn-row">
        <button class="btn btn-outline" onclick="goStep(2)">이전</button>
        <button class="btn btn-primary" onclick="tryStep4()">다음</button>
      </div>`;
    return;
  }

  if(state.step === 4){
    let resultHtml = '';
    if(state.result && state.result.raw){
      const raw = state.result.raw;
      if(raw.type === 'HIGH_FEE'){
        resultHtml = `<div class="error-box" style="background:#fdfaf3;border-color:#e6d5a8;color:#8a6d1a;">담당자 확인 필요<br>${raw.message}</div>`;
      } else {
        const cards = Object.entries(raw.results).map(([staff, r]) => {
          const cls = r.status==='O'?'ok':(r.status==='CHECK'?'check':'no');
          const icon = r.status==='O'?'✓':(r.status==='CHECK'?'!':'✕');
          const desc = r.status==='O' ? '예약 가능' : (r.status==='X' ? (r.reason||'예약 불가') : `확인 필요 (대안: ${r.alternativeTime})`);
          return `
            <div class="result-card ${cls}">
              <div class="result-left">
                <div class="status-icon ${cls}">${icon}</div>
                <div><div class="staff-name">${STAFF_DISPLAY[staff]}</div><div class="staff-status">${desc}</div></div>
              </div>
            </div>`;
        }).join('');
        resultHtml = `
          <div style="border:1px solid #eee; padding:22px;">
            <h3 style="margin-bottom:14px; font-size:14px; letter-spacing:1px; font-weight:600;">담당자별 예약 가능 여부</h3>
            ${cards}
          </div>
          <div class="fee-box">출장비 안내 : <strong>${raw.feeMessage}</strong></div>`;
      }
      resultHtml += `
        <p style="text-align:center;font-size:12px;color:#999;margin-top:20px;letter-spacing:0.3px;">문의 내용이 자동으로 접수되었습니다. 담당자가 곧 연락드립니다.</p>
        <div class="btn-row"><button class="btn btn-outline" onclick="resetAll()">새 문의 작성하기</button></div>`;
    }

    c.innerHTML = `
      <h2>문의 내용 확인</h2>
      <div class="summary-box">
        <div><strong>문의유형</strong> · ${state.inquiryType}</div>
        <div><strong>서비스</strong> · ${state.serviceType==='본식2부'?'본식2부 헤어변형':'촬영 헤어변형'}</div>
        <div><strong>날짜</strong> · ${f.date}</div>
        <div><strong>시간</strong> · ${state.serviceType==='촬영' ? `${f.startTime}부터 ${f.durationHour}시간` : `예식 ${f.ceremonyTime}`}</div>
        <div><strong>장소</strong> · ${f.place}</div>
        <div><strong>${state.inquiryType==='플래너'?'업체/담당자':'신부명/연락처'}</strong> · ${f.name} ${state.inquiryType!=='플래너'?f.phone:''}</div>
      </div>
      ${state.error ? `<div class="error-box">${state.error}</div>` : ''}
      ${!state.result && !state.loading ? `<div class="btn-row"><button class="btn btn-primary" onclick="handleCheck()">예약 가능 여부 확인</button></div>` : ''}
      ${state.loading ? `<div class="loading">확 인 중 · · ·</div>` : ''}
      ${resultHtml}
      ${!state.result ? `<div class="btn-row"><button class="btn btn-outline" onclick="goStep(3)">이전으로</button></div>` : ''}
    `;
    return;
  }
}

function tryStep3(){
  if(!state.serviceType) return;
  if(state.serviceType==='촬영' && (!state.form.startTime || !state.form.durationHour)) return;
  if(state.serviceType==='본식2부' && !state.form.ceremonyTime) return;
  goStep(3);
}
function tryStep4(){
  const f = state.form;
  if(state.inquiryType==='플래너'){
    f.name = `${f.plannerCompany} ${f.plannerName}`;
    f.phone = '-';
  }
  if(f.date && f.place &&
    ((state.inquiryType==='신랑/신부' && f.name && f.phone) ||
     (state.inquiryType==='플래너' && f.plannerCompany && f.plannerName))){
    goStep(4);
  }
}

render();
</script>
</body>
</html>
